<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — Pulse Chat</title>
    <link rel="stylesheet" href="/css/design-system.css" />
  </head>
  <body class="auth-shell">
    <div class="grid" style="width: min(100%, 1200px)">
      <div class="col-start-4">
        <a class="brand" href="/index.html" style="margin-bottom: 24px">
          <span class="brand__mark" aria-hidden="true"></span>
          Pulse Chat
        </a>
        <div class="card">
          <p class="caption">Welcome back</p>
          <h1>Log in to your workspace</h1>
          <p>Use the username or email and password for your Pulse account.</p>
          <div id="alert" class="alert alert--error" hidden></div>
          <form id="login-form" novalidate>
            <div class="field">
              <label for="identifier">Email or Username</label>
              <input id="identifier" name="identifier" type="text" autocomplete="username" placeholder="you@college.edu or Diwakar" required />
              <span class="field__error">Enter your email or username.</span>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div style="position: relative; display: flex; align-items: center;">
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required style="padding-right: 44px;" />
                <button
                  id="toggle-password-btn"
                  type="button"
                  aria-label="Show password"
                  title="Show password"
                  style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: var(--color-neutral-500); padding: 4px; display: flex; align-items: center; justify-content: center;"
                >
                  <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
              <span class="field__error">Password is required.</span>
            </div>
            <button id="submit-btn" class="btn btn--primary btn--block" type="submit">Log in</button>
          </form>
          <p class="caption" style="margin-top: 20px">
            New here? <a href="/register.html">Create an account</a>
          </p>
        </div>
      </div>
    </div>
    <script src="/js/auth.js"></script>
    <script>
      const form = document.getElementById("login-form");
      const idInput = document.getElementById("identifier");
      const passwordInput = document.getElementById("password");
      const alertBox = document.getElementById("alert");
      const submitBtn = document.getElementById("submit-btn");
      const togglePasswordBtn = document.getElementById("toggle-password-btn");
      const eyeIcon = document.getElementById("eye-icon");

      if (togglePasswordBtn) {
        togglePasswordBtn.addEventListener("click", () => {
          const isPassword = passwordInput.getAttribute("type") === "password";
          passwordInput.setAttribute("type", isPassword ? "text" : "password");
          togglePasswordBtn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
          togglePasswordBtn.setAttribute("title", isPassword ? "Hide password" : "Show password");
          if (isPassword) {
            eyeIcon.innerHTML = `
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            `;
          } else {
            eyeIcon.innerHTML = `
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            `;
          }
        });
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        setFieldError(idInput, "");
        setFieldError(passwordInput, "");
        hideAlert(alertBox);

        let valid = true;
        const identifier = idInput.value.trim();
        const password = passwordInput.value;

        if (!identifier) {
          setFieldError(idInput, "Enter your email or username.");
          valid = false;
        }

        if (!password) {
          setFieldError(passwordInput, "Password is required.");
          valid = false;
        }

        if (!valid) return;

        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";

        try {
          const res = await apiLogin({ identifier, password });

          setSession({
            token: res.token,
            id: res.user.id,
            username: res.user.username,
            name: res.user.username,
            email: res.user.email,
            status: res.user.status || "Online",
          });

          showAlert(alertBox, "Login successful! Redirecting...", "success");
          setTimeout(() => {
            window.location.href = "/chat.html";
          }, 400);
        } catch (err) {
          showAlert(alertBox, err.message || "Invalid credentials. Try again.", "error");
          submitBtn.disabled = false;
          submitBtn.textContent = "Log in";
        }
      });
    </script>
  </body>
</html>
