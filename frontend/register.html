<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account — Pulse Chat</title>
    <link rel="stylesheet" href="/css/design-system.css" />
  </head>
  <body class="auth-shell">
    <div class="grid" style="width: min(100%, 1200px)">
      <div class="col-start-4">
        <a class="brand" href="/index.html" style="margin-bottom: 24px">
          <span class="brand__mark" aria-hidden="true"></span>
          Pulse Chat
        </a>
        <div class="card">
          <p class="caption">New account</p>
          <h1>Create your Pulse profile</h1>
          <p>Join the real-time workspace with your name, email, and password.</p>
          <div id="alert" class="alert alert--error" hidden></div>
          <form id="register-form" novalidate>
            <div class="field">
              <label for="name">Full name / Username</label>
              <input id="name" name="name" type="text" autocomplete="name" placeholder="Diwakar" required />
              <span class="field__error">Name is required.</span>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="you@college.edu" required />
              <span class="field__error">Enter a valid email.</span>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div style="position: relative; display: flex; align-items: center;">
                <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required style="padding-right: 44px;" />
                <button
                  id="toggle-password-btn"
                  type="button"
                  aria-label="Show password"
                  title="Show password"
                  style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: var(--color-neutral-500); padding: 4px; display: flex; align-items: center; justify-content: center;"
                >
                  <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
              <span class="field__error">Use at least 6 characters.</span>
            </div>
            <button id="submit-btn" class="btn btn--primary btn--block" type="submit">Create account</button>
          </form>
          <p class="caption" style="margin-top: 20px">
            Already registered? <a href="/login.html">Log in</a>
          </p>
        </div>
      </div>
    </div>
    <script src="/js/auth.js"></script>
    <script>
      const form = document.getElementById("register-form");
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const alertBox = document.getElementById("alert");
      const submitBtn = document.getElementById("submit-btn");
      const togglePasswordBtn = document.getElementById("toggle-password-btn");
      const eyeIcon = document.getElementById("eye-icon");

      if (togglePasswordBtn) {
        togglePasswordBtn.addEventListener("click", () => {
          const isPassword = passwordInput.getAttribute("type") === "password";
          passwordInput.setAttribute("type", isPassword ? "text" : "password");
          togglePasswordBtn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
          togglePasswordBtn.setAttribute("title", isPassword ? "Hide password" : "Show password");
          if (isPassword) {
            eyeIcon.innerHTML = `
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            `;
          } else {
            eyeIcon.innerHTML = `
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            `;
          }
        });
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        [nameInput, emailInput, passwordInput].forEach((input) => setFieldError(input, ""));
        hideAlert(alertBox);

        let valid = true;
        const nameVal = nameInput.value.trim();
        const emailVal = emailInput.value.trim();
        const passwordVal = passwordInput.value;

        if (!nameVal) {
          setFieldError(nameInput, "Name is required.");
          valid = false;
        } else if (nameVal.length < 2) {
          setFieldError(nameInput, "Name must be at least 2 characters.");
          valid = false;
        }

        if (!emailVal || !emailVal.includes("@")) {
          setFieldError(emailInput, "Enter a valid email address.");
          valid = false;
        }

        if (passwordVal.length < 6) {
          setFieldError(passwordInput, "Use at least 6 characters.");
          valid = false;
        }

        if (!valid) return;

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account...";

        try {
          const res = await apiRegister({
            username: nameVal,
            email: emailVal,
            password: passwordVal,
          });

          setSession({
            token: res.token,
            id: res.user.id,
            username: res.user.username,
            name: res.user.username,
            email: res.user.email,
            status: res.user.status || "Online",
          });

          showAlert(alertBox, "Account created! Redirecting to chat...", "success");
          setTimeout(() => {
            window.location.href = "/chat.html";
          }, 400);
        } catch (err) {
          showAlert(alertBox, err.message || "Failed to create account. Try again.", "error");
          submitBtn.disabled = false;
          submitBtn.textContent = "Create account";
        }
      });
    </script>
  </body>
</html>
