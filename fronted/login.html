<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — Pulse Chat</title>
    <link rel="stylesheet" href="/css/design-system.css" />
  </head>
  <body class="auth-shell">
    <div class="grid" style="width: min(100%, 1200px)">
      <div class="col-start-4">
        <a class="brand" href="/index.html" style="margin-bottom: 24px">
          <span class="brand__mark" aria-hidden="true"></span>
          Pulse Chat
        </a>
        <div class="card">
          <p class="caption">Welcome back</p>
          <h1>Log in to your workspace</h1>
          <p>Use the email and password you created on the register screen.</p>
          <div id="alert" class="alert alert--error" hidden></div>
          <form id="login-form" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="you@college.edu" required />
              <span class="field__error">Enter a valid email.</span>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
              <span class="field__error">Password is required.</span>
            </div>
            <button class="btn btn--primary btn--block" type="submit">Log in</button>
          </form>
          <p class="caption" style="margin-top: 20px">
            New here? <a href="/register.html">Create an account</a>
          </p>
        </div>
      </div>
    </div>
    <script src="/js/auth.js"></script>
    <script>
      document.getElementById("login-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const alertBox = document.getElementById("alert");
        let valid = true;

        setFieldError(email, "");
        setFieldError(password, "");
        alertBox.hidden = true;

        if (!email.value.trim() || !email.value.includes("@")) {
          setFieldError(email, "Enter a valid email.");
          valid = false;
        }
        if (!password.value) {
          setFieldError(password, "Password is required.");
          valid = false;
        }
        if (!valid) return;

        const user = getUsers().find(
          (item) => item.email.toLowerCase() === email.value.trim().toLowerCase() && item.password === password.value
        );
        if (!user) {
          showAlert(alertBox, "Those credentials do not match an account.", "error");
          return;
        }
        setSession({ name: user.name, email: user.email, status: user.status || "Online" });
        window.location.href = "/chat.html";
      });
    </script>
  </body>
</html>
